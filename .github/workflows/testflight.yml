name: TestFlight

# Deliberately NOT triggered by `pull_request`. This repository is public, and a
# workflow that runs fork PRs with secrets attached can be made to leak them. Only
# a tag pushed by a collaborator, or a manual dispatch, can reach the signing key.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Archive without running tests (emergency builds only)"
        type: boolean
        default: false
      build_offset:
        description: "Added to the run number to form the build number. Raise it if a manual upload ever collides."
        required: false
        default: "1"

concurrency:
  group: testflight
  cancel-in-progress: false   # never kill an in-flight upload

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      SCHEME: BudgetTracker
      BUILD_OFFSET: ${{ inputs.build_offset || '1' }}

    steps:
      - uses: actions/checkout@v4

      # The build number must be unique per upload or App Store Connect rejects the
      # build. Deriving it from the run number makes that automatic and monotonic —
      # no hand-editing, and no silent reset when xcodegen regenerates the project.
      # Offset by 1 because build 1 is already on TestFlight.
      - name: Compute build number
        run: |
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_OFFSET ))" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        # The build number is passed to xcodebuild below rather than patched into
        # project.yml, so there's no sed dialect to get wrong and project.yml stays
        # the source of truth for everything else.
        run: |
          xcodegen generate
          echo "Building $SCHEME build $BUILD_NUMBER"

      - name: Pick an available simulator
        # Hardcoding a device name breaks every time GitHub rolls the Xcode image,
        # so ask the runner what it actually has.
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?' | head -1)
          if [ -z "$NAME" ]; then
            echo "::error::No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Using simulator: $NAME"

      # Unit tests gate the upload. The parser regressions live here, and shipping a
      # build whose amounts don't reconcile is worse than shipping late.
      - name: Run unit tests
        if: ${{ inputs.skip_tests != true }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:BudgetTrackerTests \
            -resultBundlePath UnitTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # UI tests run but do NOT gate the release. They drive a live simulator and are
      # sensitive to boot timing and animation, so a red UI test here is as likely to
      # mean "the runner was slow" as "the app is broken" — not a signal worth blocking
      # a parser fix on. Failures still show in the run summary and the artifact.
      - name: Run UI tests (non-blocking)
        if: ${{ inputs.skip_tests != true }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:BudgetTrackerUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            UnitTestResults.xcresult
            UITestResults.xcresult
          if-no-files-found: ignore

      # The key is written to the path xcodebuild and altool both search, then removed
      # in the always() cleanup below. It never lands in the workspace, so it cannot
      # be swept up by an artifact upload.
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::error::ASC_KEY_P8 / ASC_KEY_ID secrets are not set."
            exit 1
          fi

          # Secrets routinely pick up a trailing newline or stray spaces when pasted.
          # xcodebuild reports that as "Invalid authentication key credential", which
          # points at the .p8 and sends you looking in the wrong place — so trim all
          # three and export the clean values for every later step.
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

          # Shape checks only — never the values themselves.
          echo "Credential shapes:"
          echo "  ASC_KEY_ID    length ${#ASC_KEY_ID} (expect 10)"
          echo "  ASC_ISSUER_ID length ${#ASC_ISSUER_ID} (expect 36)"
          if ! printf '%s' "$ASC_KEY_ID" | grep -qE '^[A-Z0-9]{10}$'; then
            echo "::error::ASC_KEY_ID is not a 10-character App Store Connect key ID. Copy the KEY ID column from Users and Access > Integrations."
            exit 1
          fi
          if ! printf '%s' "$ASC_ISSUER_ID" \
              | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::ASC_ISSUER_ID is not a UUID. Copy the Issuer ID shown above the key table."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Rebuild canonical PEM from whatever shape the secret was pasted in.
          # Pasting a .p8 commonly flattens the line breaks, and CryptoKit then
          # rejects the document (invalidPEMDocument) even though the key material
          # is perfectly good. Stripping the armour, discarding all whitespace and
          # re-wrapping at 64 columns makes the step indifferent to how it was pasted.
          RAW=$(mktemp)
          ALL=$(mktemp)

          # Normalise line endings first — a CRLF paste breaks strict PEM parsers
          # even when the key material itself is intact.
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$ALL"

          BLOCKS=$(grep -c -- '-----BEGIN' "$ALL" || true)
          if [ "$BLOCKS" -gt 0 ]; then
            TYPES=$(grep -o -- '-----BEGIN [A-Z ]*-----' "$ALL" \
              | sed -e 's/-----BEGIN //' -e 's/-----//' | paste -sd, -)
            echo "ASC_KEY_P8 holds $BLOCKS PEM block(s): $TYPES"
          fi

          # Try every block and keep the first that is a usable private key. The
          # secret may bundle a certificate or a public key alongside the .p8, and
          # those fail `openssl pkey` — taking block 1 blindly is what broke build 6.
          # Concatenating all the bodies is worse still: openssl stops at the first
          # valid ASN.1 structure and reports success while CryptoKit rejects the
          # whole blob, which is what stalled builds 4 and 5.
          FOUND=0
          if [ "$BLOCKS" -gt 0 ]; then
            for i in $(seq 1 "$BLOCKS"); do
              awk -v want="$i" '
                /-----BEGIN/{n++}
                n==want{print}
                /-----END/{if(n==want) exit}
              ' "$ALL" > "$RAW"
              if openssl pkey -in "$RAW" -out "$KEY_PATH" 2>/dev/null; then
                echo "Using PEM block $i of $BLOCKS"
                FOUND=1
                break
              fi
              echo "  block $i is not a private key — skipping"
            done
          else
            # No armour at all — the paste flattened it. Rebuild canonical PEM from
            # the bare base64 so line breaks stop mattering.
            BODY=$(tr -d '[:space:]' < "$ALL")
            if [ -n "$BODY" ]; then
              {
                echo "-----BEGIN PRIVATE KEY-----"
                printf '%s' "$BODY" | fold -w 64
                echo ""
                echo "-----END PRIVATE KEY-----"
              } > "$RAW"
              openssl pkey -in "$RAW" -out "$KEY_PATH" 2>/dev/null && FOUND=1
            fi
          fi
          rm -f "$RAW" "$ALL"

          if [ "$FOUND" -ne 1 ]; then
            echo "::error::No usable private key found in ASC_KEY_P8. Re-copy the .p8 with: cat AuthKey_XXXX.p8 | pbcopy"
            echo "Diagnostics (no key material):"
            echo "  secret length : ${#ASC_KEY_P8}"
            echo "  PEM blocks    : $BLOCKS"
            exit 1
          fi
          chmod 600 "$KEY_PATH"

          # App Store Connect keys are always EC P-256 (prime256v1) with a ~184-char
          # body. A different curve means a different key was pasted entirely.
          CLEAN=$(sed -e '/-----/d' "$KEY_PATH" | tr -d '[:space:]')
          CURVE=$(openssl pkey -in "$KEY_PATH" -noout -text 2>/dev/null \
            | grep -i 'NIST CURVE\|ASN1 OID' | head -1 | tr -d ' ')
          echo "Key installed — ${CURVE:-curve unknown}, canonical body ${#CLEAN} chars (expect ~184)"
          if [ "$BLOCKS" -gt 1 ]; then
            echo "::warning::ASC_KEY_P8 contains $BLOCKS PEM blocks. It should hold exactly one .p8 — see PUBLISHING.md."
          fi
          if ! openssl pkey -in "$KEY_PATH" -noout -text 2>/dev/null | grep -qi 'prime256v1\|P-256'; then
            echo "::error::The key parses but is not EC P-256. Check you pasted the App Store Connect API key, not an APNs or self-generated key."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Cloud signing: -allowProvisioningUpdates plus the API key lets Xcode create
      # and download the certificate and profile on the runner. No fastlane match,
      # no checked-in certificates, nothing to rotate by hand.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath build/BudgetTracker.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>V5LHDBRQYB</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/BudgetTracker.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Resolve the path first: passing a glob straight to altool sends it the
          # literal pattern when the shell doesn't expand it, and a confusing failure.
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was produced by the export step"
            exit 1
          fi
          echo "Uploading $IPA as build $BUILD_NUMBER"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

      - name: Keep the IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BudgetTracker-build-${{ github.run_number }}
          path: build/export/*.ipa
          retention-days: 14
