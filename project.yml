    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.jaramah.BudgetTracker
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_TESTABILITY: YES   # allow @testable import from the test target

  BudgetTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BudgetTrackerTests
    dependencies:
      - target: BudgetTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.jaramah.BudgetTracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  BudgetTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BudgetTrackerUITests
    dependencies:
      - target: BudgetTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.jaramah.BudgetTracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  BudgetTracker:
    build:
      targets:
        BudgetTracker: all
    test:
      targets:
        - BudgetTrackerTests
        - BudgetTrackerUITests
    run:
      config: Debug
      # Lets the Pro purchase be tested in the simulator without App Store Connect.
      storeKitConfiguration: BudgetTracker.storekit
