name: BudgetTracker
options:
  bundleIdPrefix: com.github.jaramah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "V5LHDBRQYB"
    CODE_SIGN_STYLE: Automatic

targets:
  BudgetTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BudgetTracker
    info:
      path: BudgetTracker/Info.plist
      properties:
        CFBundleDisplayName: Budget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Unlock the app to protect your financial data."
        NSUserTrackingUsageDescription: "Allow tracking to see ads that are more relevant to you. This helps keep Budget free."
        # Google AdMob application ID. This is Google's official TEST id — replace
        # with your own before shipping (App Store Connect / AdMob console).
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        # SKAdNetwork IDs for ad attribution (Google's recommended set — see
        # https://developers.google.com/admob/ios/3p-skadnetworks for the full list).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
